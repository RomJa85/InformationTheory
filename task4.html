<script>
    // ========== Huffman ==========
    class Node {
        constructor(symbol, prob, left = null, right = null) {
            this.symbol = symbol;
            this.prob = prob;
            this.left = left;
            this.right = right;
        }
    }

    function buildHuffman(symbols, probs) {
        let nodes = symbols.map((s, i) => new Node(s, probs[i]));

        while (nodes.length > 1) {
            nodes.sort((a, b) => a.prob - b.prob);
            const left = nodes.shift();
            const right = nodes.shift();
            const parent = new Node(null, left.prob + right.prob, left, right);
            nodes.push(parent);
        }

        const codes = {};
        function traverse(node, code = '') {
            if (!node) return;
            if (node.symbol !== null) {
                codes[node.symbol] = code || '0';
                return;
            }
            traverse(node.left, code + '0');
            traverse(node.right, code + '1');
        }
        traverse(nodes[0]);
        return codes;
    }

    // ========== UI ==========
    function addRow(symbol = '', prob = '') {
        const container = document.getElementById('rows');
        const div = document.createElement('div');
        div.className = 'row';

        div.innerHTML = `
            <input type="text" class="sym" placeholder="Символ" value="${symbol}" maxlength="3">
            <input type="number" class="prob" placeholder="Вероятность" value="${prob}" min="0" step="any">
            <button type="button" class="btn-remove">×</button>
        `;

        // Удаление строки
        div.querySelector('.btn-remove').addEventListener('click', () => {
            div.remove();
            updateSum();
        });

        // Обновление суммы при вводе
        div.querySelector('.sym').addEventListener('input', updateSum);
        div.querySelector('.prob').addEventListener('input', updateSum);

        container.appendChild(div);
        updateSum();
    }

    function getData() {
        const rows = document.querySelectorAll('#rows .row');
        const symbols = [];
        const probs = [];

        rows.forEach(row => {
            const s = row.querySelector('.sym').value.trim();
            const pRaw = row.querySelector('.prob').value;
            const p = parseFloat(pRaw);

            if (s !== '' && pRaw !== '' && !isNaN(p) && p >= 0) {
                symbols.push(s);
                probs.push(p);
            }
        });

        return { symbols, probs };
    }

    function updateSum() {
        const { probs } = getData();
        const sum = probs.reduce((a, b) => a + b, 0);
        const el = document.getElementById('probSum');

        if (!el) return;

        el.textContent = sum.toFixed(6);

        if (Math.abs(sum - 1) < 0.00001) {
            el.style.color = '#276749'; // зелёный
        } else if (sum > 1) {
            el.style.color = '#c53030'; // красный
        } else {
            el.style.color = '#c05621'; // оранжевый
        }
    }

    function normalize() {
        const rows = document.querySelectorAll('#rows .row');
        let total = 0;
        const list = [];

        rows.forEach(row => {
            const input = row.querySelector('.prob');
            const val = parseFloat(input.value);
            if (!isNaN(val) && val >= 0) {
                list.push({ input, val });
                total += val;
            }
        });

        if (total === 0) {
            alert('Нет чисел для нормализации');
            return;
        }

        list.forEach(item => {
            item.input.value = (item.val / total).toFixed(6);
        });

        updateSum();
    }

    function calculate() {
        const errorEl = document.getElementById('error');
        errorEl.style.display = 'none';

        const { symbols, probs } = getData();

        if (symbols.length === 0) {
            errorEl.textContent = 'Добавьте хотя бы один символ с вероятностью';
            errorEl.style.display = 'block';
            return;
        }

        if (new Set(symbols).size !== symbols.length) {
            errorEl.textContent = 'Символы должны быть уникальными';
            errorEl.style.display = 'block';
            return;
        }

        const sum = probs.reduce((a, b) => a + b, 0);
        if (Math.abs(sum - 1) > 0.001) {
            errorEl.textContent = `Сумма вероятностей = ${sum.toFixed(6)}. Она должна быть равна 1. Нажмите «Нормализовать».`;
            errorEl.style.display = 'block';
            return;
        }

        // Энтропия
        let entropy = 0;
        probs.forEach(p => {
            if (p > 0) entropy -= p * Math.log2(p);
        });

        // Хаффман
        const codes = buildHuffman(symbols, probs);

        // Средняя длина
        let avgLen = 0;
        symbols.forEach((s, i) => {
            avgLen += probs[i] * codes[s].length;
        });

        const redundancy = avgLen - entropy;

        document.getElementById('entropyVal').textContent = entropy.toFixed(4);
        document.getElementById('avgLenVal').textContent = avgLen.toFixed(4);
        document.getElementById('redundancyVal').textContent = redundancy.toFixed(4);

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const items = symbols.map((s, i) => ({
            symbol: s,
            prob: probs[i],
            code: codes[s],
            len: codes[s].length,
            contrib: probs[i] * codes[s].length
        })).sort((a, b) => b.prob - a.prob);

        items.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.symbol}</strong></td>
                <td>${item.prob.toFixed(4)}</td>
                <td class="code">${item.code}</td>
                <td>${item.len}</td>
                <td>${item.contrib.toFixed(4)}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        // Очищаем на всякий случай
        document.getElementById('rows').innerHTML = '';

        addRow('A', '0.4');
        addRow('B', '0.3');
        addRow('C', '0.2');
        addRow('D', '0.1');

        // Назначаем обработчики кнопок (на случай, если onclick не сработал)
        document.querySelector('button[onclick="normalize()"]')?.addEventListener('click', normalize);
        document.querySelector('button[onclick="calculate()"]')?.addEventListener('click', calculate);
        document.querySelector('button[onclick="addRow()"]')?.addEventListener('click', () => addRow());
    });
</script>
